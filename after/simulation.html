<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>덴트찰리 - 시뮬레이션</title>
    <style>
        :root {
            --bg-main: #222831;
            --bg-sidebar: #2f3c48;
            --bg-chat: #1c222a;
            --patient-bubble: #5c6b73;
            --user-bubble: #1dd1a1;
            --text-main: #f5f9ff;
            --text-muted: #c4cbd8;
            --accent: #00a3ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .app-shell {
            display: grid;
            grid-template-columns: 320px 1fr 80px;
            height: 100vh;
            transition: grid-template-columns 0.3s ease;
        }

        .app-shell.sidebar-hidden {
            /* keep a small sliver visible (64px) so the open affordance doesn't overlap chat */
            grid-template-columns: 64px 1fr 80px;
        }

        /* No-sidebar mode: 대화 영역만 전체 사용 (오완 케이스 재연습용) */
        .app-shell.no-sidebar {
            grid-template-columns: 1fr;
        }

        .app-shell.no-sidebar .sidebar,
        .app-shell.no-sidebar .spacer {
            display: none;
        }

        /* Sidebar */
        .sidebar {
            background: #ffffff;
            padding: 28px 24px;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .app-shell.sidebar-hidden .sidebar {
            /* shift left but leave a sliver of the sidebar visible */
            transform: translateX(-calc(100% - 64px));
        }

        /* When sidebar is 'closed' we keep the container visible as a sliver but hide its inner contents */
        .app-shell.sidebar-hidden .sidebar > * {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            color: #1a1a1a;
        }

        .toggle-btn,
        .end-btn {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.18); /* subtle border for better visibility */
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn {
            color: #1a1a1a;
        }

        .toggle-btn:hover,
        .end-btn:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        /* 모든 체크리스트 완료 상태 */
        .end-btn.all-completed {
            background: #20b2aa;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(32, 178, 170, 0.3);
            border: 1px solid rgba(32, 178, 170, 0.6); /* slightly more visible when completed */
        }

        .end-btn.all-completed:hover {
            background: #1a9d96;
            box-shadow: 0 6px 16px rgba(32, 178, 170, 0.4);
        }

        .ccg-steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ccg-step {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.06);
            font-size: 0.95rem;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ccg-step.active {
            background: rgba(0, 163, 255, 0.15);
            color: #1a1a1a;
            border-left: 3px solid var(--accent);
        }

        .ccg-step.active::before {
            content: "▶ ";
            color: var(--accent);
        }

        /* 단계별 체크리스트 컨테이너 */
        .step-checklist {
            display: none;
            padding: 12px 14px 12px 28px;
            background: rgba(0, 163, 255, 0.08);
            border-radius: 8px;
            margin-top: 6px;
            margin-bottom: 8px;
        }

        .step-checklist.open {
            display: block;
            animation: slideDown 0.2s ease;
        }

        /* Steps-only mode: hide checklists and disable active styling */
        .steps-only .step-checklist { display: none !important; }
        .steps-only .ccg-step { cursor: default; }
        .steps-only .ccg-step.active { border-left: none; background: rgba(0,0,0,0.06); }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Chat area */
        .conversation-area {
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            padding: 20px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scenario-info span {
            display: block;
            color: var(--text-muted);
        }

        .sidebar-tip {
            font-size: 0.9rem;
            color: #1a1a1a;
            line-height: 1.5;
            margin-bottom: 14px;
            padding: 0;
        }

        /* Suggestions panel placed at bottom of sidebar */
        .suggestions-panel {
            margin-top: auto;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.04);
        }

        .navigation-panel {
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 8px;
        }

        .back-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.08);
            border: none;
            color: #1a1a1a;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        .suggestions-panel h4 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #333333;
        }

        .suggestion-chip {
            background: rgba(0, 0, 0, 0.08);
            color: #1a1a1a;
            padding: 8px 10px;
            border-radius: 16px;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.1);
            margin: 4px;
            display: inline-block;
        }

        .suggestion-chip:hover {
            background: rgba(0, 163, 255, 0.15);
            color: #1a1a1a;
            transform: translateY(-2px);
        }

        /* 체크리스트 스타일 */
        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .checklist-item:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checklist-item label {
            flex: 1;
            cursor: pointer;
            font-size: 0.9rem;
            color: #1a1a1a;
            margin: 0;
        }

        .checklist-item input[type="checkbox"]:checked + label {
            color: #888888;
            text-decoration: line-through;
        }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
        }

        .message {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 46px;
            height: 46px;
            min-width: 46px;
            min-height: 46px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            object-fit: cover;
        }

        .bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .message.patient .bubble {
            background: var(--patient-bubble);
            color: #f0f4ff;
        }

        .message.user .bubble {
            background: rgba(29, 209, 161, 0.15);
            border: 1px solid rgba(29, 209, 161, 0.4);
            color: var(--text-main);
        }

        /* Input bar */
        .input-bar {
            padding: 16px 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: var(--bg-chat);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: var(--accent);
            border: none;
            color: #041a24;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-grid;
            place-items: center;
            padding: 0;
        }

        /* Right spacer */
        .spacer {
            background: rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 1024px) {
            .app-shell {
                grid-template-columns: 280px 1fr;
            }

            .app-shell.no-sidebar {
                grid-template-columns: 1fr;
            }

            .spacer {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .app-shell {
                grid-template-columns: 0 1fr;
            }

            .app-shell.no-sidebar {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                z-index: 10;
            }

            .chat-scroll .message .bubble {
                max-width: 100%;
            }
        }

    /* Floating open button styles */
    #open-sidebar-btn {
        position: fixed;
        left: 18px;
        top: 18px;
        z-index: 60;
        display: none;
        padding: 12px 14px;
        border-radius: 10px;
        border: none;
        background: rgba(0,0,0,0.6);
        color: white;
        font-weight: 600;
        box-shadow: 0 6px 18px rgba(0,0,0,0.35);
        touch-action: manipulation;
    }

    @media (max-width: 480px) {
        /* move the open button slightly down to avoid phone notches and increase hit area */
        #open-sidebar-btn {
            left: 12px;
            top: 44px;
            padding: 14px 16px;
            font-size: 1rem;
        }

        /* tighten layout for small screens */
        .input-bar {
            padding: 12px 14px;
        }

        .input-field {
            padding: 12px 10px;
            font-size: 0.95rem;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            padding: 0;
        }
    }
    </style>
</head>
<body>
    <div class="app-shell" id="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="navigation-panel">
                <a href="case-selection.html" class="back-btn" id="sidebar-back-btn" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">⬅ 케이스 다시 선택하기</a>
            </div>

            <div class="sidebar-header">
                <h2>대화 흐름 가이드 (CCG)</h2>
                <button class="toggle-btn" id="toggle-btn">닫기</button>
            </div>
            <div class="ccg-steps">
                <div class="ccg-step" data-step="0">1. 인사 및 환자 확인</div>
                <div class="step-checklist" id="checklist-0"></div>
                
                <div class="ccg-step" data-step="1">2. 방문 이유 확인</div>
                <div class="step-checklist" id="checklist-1"></div>
                
                <div class="ccg-step" data-step="2">3. 정보 수집 및 공감</div>
                <div class="step-checklist" id="checklist-2"></div>
                
                <div class="ccg-step" data-step="3">4. 치료 계획 설명</div>
                <div class="step-checklist" id="checklist-3"></div>
                
                <div class="ccg-step" data-step="4">5. 진료 마무리</div>
                <div class="step-checklist" id="checklist-4"></div>
            </div>
            <p class="sidebar-tip">각 단계 체크리스트를 확인하면서 환자를 진료하는 과정에서 필요한 내용을 확인하세요.</p>

            <!-- 제안 패널 제거됨 -->
        </aside>

        <section class="conversation-area">
            <div class="top-bar">
                <div class="scenario-info">
                    <strong id="case-title">시나리오</strong>
                    <span id="patient-info">환자 정보</span>
                </div>
                <button class="end-btn" id="end-btn">시뮬레이션 종료</button>
            </div>

            <!-- Suggestions for current step (step 1 shown by default) -->
            <div class="suggestions" id="suggestions" aria-hidden="false">
                <!-- chips populated by JS -->
            </div>

            <div class="chat-scroll" id="chat-scroll">
                <div id="chat-messages"></div>
            </div>

            <div class="input-bar">
                    <input type="text" class="input-field" id="message-input" placeholder="메시지를 입력하세요.">
                    <button class="send-btn" id="send-btn" aria-label="전송" title="전송">
                        <!-- paper-plane icon -->
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" style="display:block;">
                            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
            </div>
        </section>

        <div class="spacer"></div>
    </div>

    <!-- floating open button shown when sidebar is hidden -->
    <button id="open-sidebar-btn">열기</button>

    <script>
        // 🔄 Session ID 생성 (20명이 같은 세션에 참여)
        const sessionId = getQueryParam('session') || 'default-session';
        let syncPollInterval = null;

        // 공유 상태 폴링 함수 (1초마다 확인)
        async function pollSharedState() {
            try {
                const response = await fetch(`/api/sync?sessionId=${encodeURIComponent(sessionId)}`);
                if (!response.ok) return;
                
                const { data, timestamp } = await response.json();
                if (!data) return;
                
                // 공유 상태 적용 (예: 팀 진행 상황, 공지사항 등)
                handleSharedStateUpdate(data);
            } catch (err) {
                console.warn('[Sync] Polling error:', err.message);
            }
        }

        // 공유 상태 처리
        function handleSharedStateUpdate(sharedData) {
            // 예시: 모든 참가자에게 공지
            if (sharedData?.announcement && !window.lastAnnouncement) {
                window.lastAnnouncement = sharedData.announcement;
                console.log('[Shared] Announcement:', sharedData.announcement);
                // UI에 공지사항 표시 가능
            }
            
            // 진행 상황 추적
            if (sharedData?.groupProgress) {
                console.log(`[Sync] Group Progress: ${sharedData.groupProgress.completed}/${sharedData.groupProgress.total}`);
            }
        }

        // 상태 업데이트 함수 (로컬 진행 상황을 공유 저장소에 전송)
        async function uploadLocalProgress() {
            try {
                const progressData = {
                    sessionId,
                    case: selected,
                    messageCount: conversationHistory.length,
                    currentStep,
                    timestamp: Date.now()
                };

                await fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId,
                        data: {
                            ...progressData,
                            // 모든 사용자의 진행 상황을 수집할 수 있음
                        },
                        ttl: 3600
                    })
                });
            } catch (err) {
                console.warn('[Sync] Upload error:', err.message);
            }
        }

        // 페이지 로드 시 폴링 시작
        function startSyncPolling() {
            if (syncPollInterval) clearInterval(syncPollInterval);
            syncPollInterval = setInterval(pollSharedState, 1000); // 1초마다 확인
            console.log('[Sync] Polling started for session:', sessionId);
        }

        // 페이지 언로드 시 폴링 중지
        window.addEventListener('beforeunload', () => {
            if (syncPollInterval) clearInterval(syncPollInterval);
        });

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        const toggleBtn = document.getElementById('toggle-btn');
        const appShell = document.getElementById('app-shell');
        const sidebar = document.getElementById('sidebar');
        const viewMode = getQueryParam('view');
        if (viewMode === 'steps-only') {
            sidebar.classList.add('steps-only');
        } else if (viewMode === 'no-sidebar') {
            appShell.classList.add('no-sidebar');
        }
        const openSidebarBtn = document.getElementById('open-sidebar-btn');

        function updateSidebarUI() {
            // no-sidebar 모드에서는 토글/플로팅 버튼 모두 숨김
            if (appShell.classList.contains('no-sidebar')) {
                if (toggleBtn) toggleBtn.style.display = 'none';
                if (openSidebarBtn) openSidebarBtn.style.display = 'none';
                return;
            }
            const hidden = appShell.classList.contains('sidebar-hidden');
            // toggleBtn text inside sidebar
            if (toggleBtn) toggleBtn.textContent = hidden ? '열기' : '닫기';
            // floating button shown when hidden
            if (openSidebarBtn) openSidebarBtn.style.display = hidden ? 'block' : 'none';
        }

        toggleBtn.addEventListener('click', () => {
            const hidden = appShell.classList.toggle('sidebar-hidden');
            updateSidebarUI();
        });

        // open button handler
        if (openSidebarBtn) {
            openSidebarBtn.addEventListener('click', () => {
                appShell.classList.remove('sidebar-hidden');
                updateSidebarUI();
            });
        }

        // initial UI sync
        updateSidebarUI();
        
        // 동기화 폴링 시작
        startSyncPolling();

        // 시뮬레이션 시작 시간 기록
        const simulationStartTime = Date.now();

        // End simulation -> feedback
        const endBtn = document.getElementById('end-btn');
        if (endBtn) {
            endBtn.addEventListener('click', async () => {
                try {
                    endBtn.disabled = true;
                    endBtn.textContent = '피드백 분석 중...';

                    // ✅ 피드백 생성 중 상태를 먼저 저장
                    const elapsedSeconds = Math.round((Date.now() - simulationStartTime) / 1000);
                    localStorage.setItem('last_conversation', JSON.stringify({
                        caseId: selected,
                        items: conversationHistory,
                        elapsedSeconds: elapsedSeconds,
                        feedbacks: [],
                        isGenerating: true
                    }));
                    
                    // 진행 상황 업로드
                    await uploadLocalProgress();
                    
                    // 피드백 화면으로 이동 (로딩 상태 표시)
                    window.location.href = 'feedback.html';
                    
                    // ✅ 백그라운드에서 피드백 생성
                    setTimeout(async () => {
                        try {
                            console.log('[FEEDBACK] Starting feedback generation...');
                            console.log('[FEEDBACK] Case ID:', selected);
                            console.log('[FEEDBACK] Conversation turns:', conversationHistory.length);
                            
                            // ✅ 타임아웃 제거 - API 응답이 올 때까지 대기
                            const feedbackStartTime = Date.now();
                            console.log('[FEEDBACK] Sending simplified request to /api/feedback');
                            
                            const feedbackRes = await fetch('/api/feedback', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    conversationHistory: conversationHistory,
                                    caseId: selected
                                })
                            });
                            const feedbackDuration = Date.now() - feedbackStartTime;
                            
                            console.log('[FEEDBACK] Response received:', {
                                status: feedbackRes.status,
                                statusText: feedbackRes.statusText,
                                duration: feedbackDuration + 'ms'
                            });

                            if (!feedbackRes.ok) {
                                console.error('[FEEDBACK] API error:', {
                                    status: feedbackRes.status,
                                    statusText: feedbackRes.statusText
                                });
                            }

                            const feedbackData = await feedbackRes.json();
                            console.log('[FEEDBACK] Parsed response:', feedbackData);
                            console.log('[FEEDBACK] Feedbacks count:', feedbackData.feedbacks?.length || 0);

                            // 피드백 완료 후 업데이트
                            localStorage.setItem('last_conversation', JSON.stringify({
                                caseId: selected,
                                items: conversationHistory,
                                feedbacks: feedbackData.feedbacks || [],
                                isGenerating: false
                            }));
                            
                            console.log('[FEEDBACK] Successfully saved to localStorage');
                            
                            // 피드백 페이지에 새로고침 신호
                            window.dispatchEvent(new CustomEvent('feedbackReady'));
                        } catch (e) {
                            console.error('[FEEDBACK] Exception caught:', {
                                name: e.name,
                                message: e.message,
                                stack: e.stack
                            });
                            
                            if (e.name === 'AbortError') {
                                console.warn('[FEEDBACK] Abort/Timeout error - using mock data');
                                // 5초 이상 걸리면 mock 데이터 사용
                                const mockData = {
                                    caseId: selected,
                                    items: conversationHistory,
                                    feedbacks: [
                                        { stage: '1단계: 인사 및 환자 확인', done: true, text: '환자 이름과 자신을 명확히 소개했습니다.' },
                                        { stage: '2단계: 방문 이유 확인', done: true, text: '개방형 질문으로 환자의 주요 증상을 파악했습니다.' },
                                        { stage: '3단계: 정보 수집 및 공감', done: true, text: '환자의 상황을 이해하려는 노력을 보였습니다.' },
                                        { stage: '4단계: 치료 계획 설명', done: true, text: '치료 옵션을 명확하게 설명했습니다.' },
                                        { stage: '5단계: 진료 마무리', done: true, text: '다음 방문 일정을 안내했습니다.' }
                                    ],
                                    isGenerating: false
                                };
                                localStorage.setItem('last_conversation', JSON.stringify(mockData));
                                console.log('[FEEDBACK] Mock data saved');
                                window.dispatchEvent(new CustomEvent('feedbackReady'));
                            } else {
                                console.error('[FEEDBACK] Non-timeout error - saving empty feedbacks');
                                // 피드백 없이 표시
                                localStorage.setItem('last_conversation', JSON.stringify({
                                    caseId: selected,
                                    items: conversationHistory,
                                    feedbacks: [],
                                    isGenerating: false
                                }));
                                window.dispatchEvent(new CustomEvent('feedbackReady'));
                            }
                        }
                    }, 100);
                } catch (e) {
                    console.error('Error in end button handler:', e);
                    window.location.href = 'feedback.html';
                }
            });
        }

        // Parse ?case and render patient header + initial messages
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        const cases = {
            'lee-jiwon': {
                title: '시나리오: 이지원',
                info: 'M · 25 · 불안형',
                symptom: '입 안이 쓰라려요',
                messages: [
                    {role: 'patient', text: '안녕하세요'},
                ]
            },
            'jo-minseon': {
                title: '시나리오: 조민선',
                info: 'F · 30 · 민감형',
                symptom: '사랑니가 아파요',
                messages: [
                    {role: 'patient', text: '안녕하세요.'}
                ]
            },
            'oh-owan': {
                title: '시나리오: 오완',
                info: 'M · 8 · 상담형 (보호자 동반)',
                symptom: '혀가 짧아요',
                messages: [
                    {role: 'patient', text: '안녕하세요 선생님'}
                ]
            }
        };

        const selected = getQueryParam('case') || 'lee-jiwon';
        const meta = cases[selected] || cases['lee-jiwon'];
        document.getElementById('case-title').textContent = meta.title;
        document.getElementById('patient-info').textContent = meta.info;
        
        // 환자 증상 표시
        const patientInfoEl = document.querySelector('.scenario-info');
        const symptomEl = document.createElement('span');
        symptomEl.style.color = 'var(--text-main)';
        symptomEl.style.fontWeight = '500';
        symptomEl.textContent = `증상: ${meta.symptom}`;
        patientInfoEl.appendChild(symptomEl);

    const chatMessages = document.getElementById('chat-messages');
    const conversationHistory = [];
    let lastUserMessageTs = Date.now();
    let lastGuidanceToastTs = 0;
    let guidanceToastEl = null;

    // ✅ 오른쪽 하단 가이드 토스트 (이지원 케이스에서 장시간 입력 없을 때)
    function showGuidanceToast(message) {
        if (!guidanceToastEl) {
            guidanceToastEl = document.createElement('div');
            guidanceToastEl.id = 'guidance-toast';
            Object.assign(guidanceToastEl.style, {
                position: 'fixed', right: '18px', bottom: '18px', zIndex: 120,
                maxWidth: '320px', padding: '14px 16px', borderRadius: '14px',
                background: 'rgba(0,0,0,0.78)', color: '#f5f5f5',
                boxShadow: '0 12px 28px rgba(0,0,0,0.35)',
                border: '1px solid rgba(255,255,255,0.08)',
                display: 'none', lineHeight: '1.45', fontSize: '0.92rem',
                backdropFilter: 'blur(6px)'
            });
            const content = document.createElement('div');
            content.className = 'toast-content';
            const closeBtn = document.createElement('button');
            closeBtn.textContent = '닫기';
            Object.assign(closeBtn.style, {
                marginTop: '10px', padding: '6px 10px', borderRadius: '10px',
                border: '1px solid rgba(255,255,255,0.15)', background: 'rgba(255,255,255,0.08)',
                color: '#f5f5f5', cursor: 'pointer'
            });
            closeBtn.addEventListener('click', () => { guidanceToastEl.style.display = 'none'; });
            guidanceToastEl.appendChild(content);
            guidanceToastEl.appendChild(closeBtn);
            document.body.appendChild(guidanceToastEl);
        }
        const contentEl = guidanceToastEl.querySelector('.toast-content');
        if (contentEl) contentEl.textContent = message;
        guidanceToastEl.style.display = 'block';
    }

    // 🔍 공통 누락 패턴(케이스/단계별)과 최근 대화 기반 평가
    const missingPatternsByCase = {
        'lee-jiwon': {
            1: [
                { label: '환자 이름 확인/자기소개', keywords: ['이름', '성함', '소개', '저는'] }
            ],
            2: [
                { label: '주증상 구체화', keywords: ['증상', '어떤', '불편', '주호소'] },
                { label: '내원 이유 파악', keywords: ['왜', '방문', '내원', '오셨어요'] },
                { label: '우려/기대 확인', keywords: ['걱정', '우려', '기대', '바라는'] }
            ],
            3: [
                { label: '시작 시점(언제부터)', keywords: ['언제', '시작', '기간', '며칠', '주'] },
                { label: '통증 강도/양상', keywords: ['통증', '아픈', '강도', '정도', 'VAS'] },
                { label: '악화/완화 요인', keywords: ['악화', '완화', '더 심해', '나아져'] },
                { label: '일상생활 영향', keywords: ['생활', '일상', '불편', '지장'] },
                { label: '감정 공감', keywords: ['감정', '기분', '불안', '걱정', '이해합니다'] }
            ]
        }
    };

    function recentText(history, turns = 6) {
        const slice = history.slice(-turns);
        return slice.map(m => (m && m.text) ? String(m.text) : '').join(' ');
    }

    function missingByPatterns(caseId, stepIndex, history) {
        const patterns = (missingPatternsByCase[caseId] || {})[stepIndex] || [];
        const text = recentText(history).toLowerCase();
        const miss = [];
        patterns.forEach(p => {
            const hit = (p.keywords || []).some(kw => text.includes(String(kw).toLowerCase()));
            if (!hit) miss.push(p.label);
        });
        return miss;
    }

    // 입력이 길게 없으면 체크리스트 기준으로 안내 (lee-jiwon 한정)
    function pollGuidanceToast() {
        if (selected !== 'lee-jiwon') return;
        const now = Date.now();
        const idleMs = now - lastUserMessageTs;
        if (idleMs < 30000) return; // 30초 무응답 시도
        if (now - lastGuidanceToastTs < 50000) return; // 최소 50초 간격

        const checklistEl = document.getElementById(`checklist-${currentStep}`);
        let unchecked = [];
        if (checklistEl) {
            unchecked = Array.from(checklistEl.querySelectorAll('input[type="checkbox"]'))
                .filter(cb => !cb.checked)
                .map(cb => cb.nextElementSibling?.textContent?.trim())
                .filter(Boolean);
        }
        const fallbackList = suggestionSetsByPatient[selected]?.[currentStep] || [];
        const patternMiss = missingByPatterns(selected, currentStep, conversationHistory);
        const merged = [...patternMiss, ...unchecked, ...fallbackList];
        const items = Array.from(new Set(merged)).slice(0, 3);
        if (items.length === 0) return;

        const stepLabel = ccgStepEls[currentStep]?.textContent?.trim() || `단계 ${currentStep + 1}`;
        showGuidanceToast(`${stepLabel}에서 아직 언급 안 된 항목: ${items.join(', ')}`);
        lastGuidanceToastTs = now;
    }
    setInterval(pollGuidanceToast, 5000);

    function appendMessage(role, text, record = true) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role === 'user' ? 'user' : 'patient'}`;
            if (role === 'patient') {
                // choose image by selected case; fallback to generic
                const imgMap = {
                    'lee-jiwon': 'lee-jiwon.png',
                    'jo-minseon': 'jo-minseon.png',
                    'oh-owan': 'oh-owan-guardian.png'
                };
                const imgFile = imgMap[selected] || 'patient.png';
                const imgSrc = `/after/images/${imgFile}`;
                console.log('Loading patient image:', imgSrc);
                wrapper.innerHTML = `<img src="${imgSrc}" class="avatar" alt="patient"><div class="bubble">${text}</div>`;
            } else {
                wrapper.innerHTML = `<div class="bubble">${text}</div>`;
            }
            chatMessages.appendChild(wrapper);
            // record message (unless this is a transient/typing placeholder)
            if (record) {
                conversationHistory.push({role, text, ts: Date.now()});
                if (role === 'user') lastUserMessageTs = Date.now();
            }
            // scroll to bottom
            chatMessages.parentElement.scrollTop = chatMessages.parentElement.scrollHeight;
        }

        // render initial messages
        meta.messages.forEach(m => appendMessage(m.role, m.text));

        // --- CCG step management and suggestion sets
        const ccgStepEls = Array.from(document.querySelectorAll('.ccg-step'));
        let currentStep = 0; // 0-based index for steps 1..5

        // suggestion sets per patient id (lee-jiwon, jo-minseon, oh-owan)
        const suggestionSetsByPatient = {
            'lee-jiwon': [
                ['환자 이름 확인', '자신을 명확히 소개', '라포 형성'],
                ['주증상 확인', '내원 이유 확인', '환자의 우려·기대 확인'],
                ['언제부터 증상이 시작됐는지 확인', '임상적 특징 확인 (통증 강도, 악화 요인)', '환자의 감정 이해'],
                ['진단 설명', '치료 옵션 제시', '환자 동의 확인'],
                ['치료 내용 요약', '예후 설명', '질문 기회 제공', '다음 진료 일정 안내']
            ],
            'jo-minseon': [
                ['환자 이름 확인', '자신을 명확히 소개', '라포 형성'],
                ['주증상 확인', '내원 이유 확인', '다른 증상 확인'],
                ['증상 시작 시점 확인', '통증 특성 파악', '붓기 및 제한 증상 확인'],
                ['상황 정리 및 설명', '약물 치료 방침 공지', '발치 여부 후속 계획 설명'],
                ['세정 및 약물 치료 방침 설명', '응급 상황 안내', '추적관찰 일정 안내']
            ],
            'oh-owan': [
                ['보호자 신원 및 아이 이름 확인', '자신을 명확히 소개', '편안한 분위기 조성'],
                ['내원 이유 확인', '혀 움직임 문제 확인', '발음 문제 상세히 청취'],
                ['증상 시작 시점 파악', '특정 발음 확인', '일상생활 영향도 확인'],
                ['현재 상황 정리', '혀 단축증 설명', '치료 옵션 설명 (관찰/운동/수술)'],
                ['선택된 치료 방침 설명', '추적관찰 계획 안내', '응급 상황 안내', '다음 방문 일정 예약']
            ]
        };

        const suggestionChipsContainer = document.getElementById('suggestion-chips');
        const suggestionsTitle = document.getElementById('suggestions-title');

        function buildSuggestionChip(text){
            const checklistId = `check-${Math.random().toString(36).substr(2, 9)}`;
            const container = document.createElement('div');
            container.className = 'checklist-item';
            container.innerHTML = `
                <input type="checkbox" id="${checklistId}">
                <label for="${checklistId}">${text}</label>
            `;
            
            // 체크박스 변경 감지 - 바로 여기서 추가
            const checkbox = container.querySelector('input[type="checkbox"]');
            checkbox.addEventListener('change', () => {
                checkAllChecklistsCompleted();
            });
            
            return container;
        }

        function renderChecklistForStep(stepIndex) {
            const patientId = selected || 'lee-jiwon';
            const setsForPatient = suggestionSetsByPatient[patientId] || suggestionSetsByPatient['lee-jiwon'];
            const checklistContainer = document.getElementById(`checklist-${stepIndex}`);
            
            if (!checklistContainer) return;
            
            checklistContainer.innerHTML = '';
            (setsForPatient[stepIndex] || []).forEach(txt => {
                checklistContainer.appendChild(buildSuggestionChip(txt));
            });
        }

        function renderAllChecklists() {
            for (let i = 0; i < 5; i++) {
                renderChecklistForStep(i);
            }
        }

        // Check if all checklists are completed
        function checkAllChecklistsCompleted() {
            const allCheckboxes = document.querySelectorAll('.checklist-item input[type="checkbox"]');
            if (allCheckboxes.length === 0) return false;
            
            const allChecked = Array.from(allCheckboxes).every(checkbox => checkbox.checked);
            const endBtn = document.getElementById('end-btn');
            
            console.log(`[Checklist] Total: ${allCheckboxes.length}, Checked: ${Array.from(allCheckboxes).filter(c => c.checked).length}, All completed: ${allChecked}`);
            
            if (allChecked) {
                endBtn.classList.add('all-completed');
                console.log('[Checklist] ✅ All completed - button turned turquoise');
            } else {
                endBtn.classList.remove('all-completed');
                console.log('[Checklist] ❌ Not all completed - button back to gray');
            }
            
            return allChecked;
        }

        // Initialize all checklists on page load
        renderAllChecklists();
        checkAllChecklistsCompleted();

        // Click handler for stages to toggle checklist visibility
        ccgStepEls.forEach((el, i) => {
            el.addEventListener('click', () => {
                if (sidebar.classList.contains('steps-only')) return; // disable toggle in steps-only mode
                currentStep = i;
                const checklistEl = document.getElementById(`checklist-${i}`);
                
                // Close all other checklists
                document.querySelectorAll('.step-checklist').forEach((cl, idx) => {
                    if (idx !== i) {
                        cl.classList.remove('open');
                    }
                });
                
                // Toggle current checklist
                checklistEl.classList.toggle('open');
                
                // Update active class
                ccgStepEls.forEach((step, idx) => {
                    step.classList.toggle('active', idx === i);
                });
            });
        });

        // enable send input
        const inputField = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // 재시도 로직이 포함된 fetch 함수
        async function fetchWithRetry(url, options, maxRetries = 2) {
            let lastError;
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(url, options);
                    // 429 (Rate Limit)는 재시도
                    if (response.status === 429 && attempt < maxRetries) {
                        const retryAfter = response.headers.get('retry-after') || (attempt + 1) * 2;
                        const waitTime = parseInt(retryAfter) * 1000;
                        console.warn(`[429] Rate limited - waiting ${waitTime}ms before retry ${attempt + 1}/${maxRetries}`);
                        await new Promise(resolve => setTimeout(resolve, waitTime));
                        continue;
                    }
                    return response;
                } catch (err) {
                    lastError = err;
                    if (attempt < maxRetries) {
                        console.warn(`Network error, retry attempt ${attempt + 1}/${maxRetries}: ${err.message}`);
                        // 지수 백오프: 500ms, 1000ms
                        await new Promise(resolve => setTimeout(resolve, (attempt + 1) * 500));
                        continue;
                    }
                }
            }
            throw lastError;
        }

        function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;
            appendMessage('user', text);
            inputField.value = '';
            // call serverless LLM endpoint with caseId, current step, and conversation history
            const payload = { caseId: selected, userMessage: text, recent: conversationHistory, currentStep: currentStep };
            // show typing placeholder (transient, not recorded)
            appendMessage('patient', '...', false);
            const typingEl = chatMessages.lastElementChild;
            inputField.disabled = true;
            sendBtn.disabled = true;
            
            // 로드 밸런싱은 서버 측에서 자동으로 처리 (GENAI_API_KEY와 GENAI_API_KEY_2 사용)
            const endpoint = '/api/generate';
            console.log(`[Chat] Sending message to ${endpoint}`);
            
            fetchWithRetry(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }, 2)
            .then(async (r) => {
                // read raw body text first (handles JSON and plain text errors)
                const raw = await r.text().catch(() => '');
                if (!r.ok) {
                    // non-2xx: show server/provider response (if any)
                    if (typingEl && typingEl.parentElement) typingEl.remove();
                    const msg = raw || `서버 응답 오류: ${r.status}`;
                    appendMessage('patient', `서버 오류: ${msg}`);
                    throw new Error(msg);
                }
                // try to parse JSON; if it fails, show raw text as reply
                let json = null;
                try {
                    json = JSON.parse(raw || '{}');
                } catch (e) {
                    if (typingEl && typingEl.parentElement) typingEl.remove();
                    const fallback = raw || '응답 포맷 오류';
                    appendMessage('patient', fallback);
                    return;
                }
                if (typingEl && typingEl.parentElement) typingEl.remove();
                const reply = json?.text || '죄송합니다, 응답이 없습니다.';
                appendMessage('patient', reply);
            })
            .catch(err => {
                if (typingEl && typingEl.parentElement) typingEl.remove();
                console.error('fetch error', err);
                // If an error message was already shown above, avoid duplicate generic message
                const errText = (err && err.message) ? err.message : '';
                if (!errText.includes('서버 오류')) {
                    appendMessage('patient', '다시 말씀해 주세요.');
                }
            })
            .finally(() => {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            });
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
